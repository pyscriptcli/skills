<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | PRIME Philippines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --prime-blue: #003366;
      --prime-warm-white: #FFFCFB;
      --prime-gold: #C9A84C;
      --prime-yellow: #FFBF00;
      --prime-gray: #181D1E;
      --prime-deep-ink: #0C0C0E;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-impact: 'Bebas Neue', Impact, sans-serif;
      --font-ui: 'Montserrat', Arial, sans-serif;
      --prime-radius: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      background: #E8E5DF;
      color: var(--prime-gray);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    .deck-container {
      width: 1200px;
      height: 675px;
      position: relative;
      background: var(--prime-warm-white);
      border: 1px solid #D9D5CD;
      box-shadow: 0 16px 40px rgba(0, 51, 102, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
      padding: 40px 54px;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide.active {
      display: flex;
    }

    .surface-blue {
      background: var(--prime-blue) !important;
      color: var(--prime-warm-white) !important;
    }

    .surface-white {
      background: var(--prime-warm-white) !important;
      color: var(--prime-gray) !important;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-eyebrow {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--prime-gold);
      margin-bottom: 4px;
    }

    .slide-title {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .divider {
      width: 52px;
      height: 2px;
      background: var(--prime-gold);
      margin-top: 6px;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 4px 0 10px 0;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(201, 168, 76, 0.35);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 1200px;
      margin-top: 14px;
    }

    .btn {
      background: var(--prime-blue);
      color: var(--prime-warm-white);
      border: 1px solid var(--prime-blue);
      padding: 9px 22px;
      font-family: var(--font-ui);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
    }

    .counter {
      font-family: var(--font-impact);
      font-size: 20px;
      letter-spacing: 0.1em;
      color: var(--prime-blue);
    }

    @page {
      size: 16in 9in;
      margin: 0;
    }

    @media print {
      html, body {
        background: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 16in !important;
        height: auto !important;
      }
      .controls {
        display: none !important;
      }
      .deck-container {
        width: 16in !important;
        height: auto !important;
        border: none !important;
        box-shadow: none !important;
        display: block !important;
      }
      .slide {
        display: flex !important;
        width: 16in !important;
        height: 9in !important;
        padding: 50px 76px !important;
        page-break-after: always !important;
        break-after: page !important;
      }
    }
  </style>
</head>
<body>

  <div class="deck-container" id="deckContainer">
    <!-- SLIDES INJECTED HERE -->
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn" onclick="changeSlide(-1)">Previous</button>
    <div class="counter" id="slideCounter">SLIDE 1 / 1</div>
    <button class="btn" id="nextBtn" onclick="changeSlide(1)">Next</button>
  </div>

  <script>
    let currentSlide = 1;
    let totalSlides = document.querySelectorAll('.slide').length;

    function updateDeck() {
      document.querySelectorAll('.slide').forEach((s, idx) => {
        s.classList.toggle('active', (idx + 1) === currentSlide);
      });
      document.getElementById('slideCounter').textContent = `SLIDE ${currentSlide} / ${totalSlides}`;
      document.getElementById('prevBtn').disabled = (currentSlide === 1);
      document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);
    }

    function changeSlide(direction) {
      const target = currentSlide + direction;
      if (target >= 1 && target <= totalSlides) {
        currentSlide = target;
        updateDeck();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft') {
        changeSlide(-1);
      }
    });

    updateDeck();
  </script>
</body>
</html>
